name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/scanbox

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "ruff==0.17.6"
      - run: ruff check backend tools

  backend-tests:
    # Runs the whole backend suite (incl. OCR tests with real tesseract/ocrmypdf/ghostscript)
    # and the simulator suite inside the Docker `test` target – same OS packages as production.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: scanbox:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test
      - name: Run tests
        run: docker run --rm -e SCANBOX_REQUIRE_OCR=1 scanbox:test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend-tests, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: scanbox:dev
          cache-from: type=gha,scope=runtime
      - name: Start stack (app + simulator)
        run: |
          docker compose -f docker-compose.dev.yml up -d --no-build scanbox escl-sim || \
          docker compose -f docker-compose.dev.yml up -d --build scanbox escl-sim
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/readyz && break; sleep 2; done
          curl -fsS http://localhost:8080/readyz
          # the running app reports the release version (admin diagnostics, /healthz, logs)
          test "$(curl -fsS http://localhost:8080/healthz | jq -r .version)" = "${{ needs.publish.outputs.version }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_SIM_URL: http://localhost:8090
          E2E_USER: admin
          E2E_PASSWORD: adminadmin
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color | tail -300
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  systest:
    # The real container with every external service on the network (SMTP, Paperless, OIDC, webhooks),
    # real OCR, and a SIGKILL restart while a scan and an OCR job are running. See tools/systest.sh.
    needs: [backend-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: scanbox:dev
          cache-from: type=gha,scope=runtime
      - name: Build tools image (mocks + test runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: scanbox:test-tools
          cache-from: type=gha,scope=test
      - run: docker compose -f docker-compose.systest.yml build escl-sim
      - run: tools/systest.sh

  publish:
    if: github.event_name != 'pull_request'
    needs: [lint, backend-tests, frontend, e2e, systest]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        # The release tag is the only source of the version: v1.2.3 -> 1.2.3. Other builds are named
        # after branch and commit (main-3f8a1c2), so they never pose as a release.
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Release tags must look like v1.2.3 (or v1.2.3-rc.1), got $GITHUB_REF_NAME"
              exit 1
            fi
            v="${GITHUB_REF_NAME#v}"
          else
            b="${GITHUB_REF_NAME//[^0-9A-Za-z.-]/-}"
            v="${b}-${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.ver.outputs.version }}

  verify-published:
    # Pull the image exactly as published (by digest) and run the system test and the browser tests
    # against it – proves the registry artifact behaves like the tested build.
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve published reference
        # image references must be lowercase (the owner name isn't)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "PUBLISHED=ghcr.io/${owner}/scanbox@${{ needs.publish.outputs.digest }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull published image
        run: |
          docker pull "$PUBLISHED"
          docker image inspect "$PUBLISHED" --format 'version={{index .Config.Labels "org.opencontainers.image.version"}} revision={{index .Config.Labels "org.opencontainers.image.revision"}}'
          test "$(docker image inspect "$PUBLISHED" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$PUBLISHED" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "${{ needs.publish.outputs.version }}"
      - name: Build tools image (mocks + test runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: scanbox:test-tools
          cache-from: type=gha,scope=test
      - run: docker compose -f docker-compose.systest.yml build escl-sim
      - name: System test against the published image
        run: SCANBOX_IMAGE="$PUBLISHED" tools/systest.sh
      - name: Start published image with simulator for the browser tests
        run: |
          docker tag "$PUBLISHED" scanbox:dev
          docker compose -f docker-compose.dev.yml up -d --no-build scanbox escl-sim
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/readyz && break; sleep 2; done
          curl -fsS http://localhost:8080/readyz
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_SIM_URL: http://localhost:8090
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color | tail -300
